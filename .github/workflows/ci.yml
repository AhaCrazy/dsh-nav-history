name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle is generated from src/
        run: node scripts/build.mjs --check
      - name: Tests
        run: node --test tests/history.test.mjs tests/apply.test.mjs tests/build.test.mjs
